name: solo15-loomlab
services:
  loomlab:
    build: .
    image: solo15-loomlab:1.0
    container_name: solo15-loomlab
    ports:
      - "127.0.0.1:18915:18915"
    volumes:
      - loomlab_data:/data
    environment:
      LOOMLAB_DATA_DIR: /data
      PORT: "18915"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD","python","-c","import urllib.request;urllib.request.urlopen('http://127.0.0.1:18915/loom/health')"]
      interval: 15s
      timeout: 4s
      retries: 3
volumes:
  loomlab_data:
