<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoomLab · 纺织材质工作台</title><link rel="stylesheet" href="/static/loom.css"></head><body><aside><a class="brand" href="/">Loom<span>Lab</span></a><p class="muted">TEXTILE MATERIAL STUDIO</p><button id="new">＋ 新建材质</button><button id="demo">载入合成斜纹示范</button><div id="list"></div><div class="bottom"><button id="import">导入可编辑工程</button><a href="/prepare">↗ 材质源图准备工具</a><small>本地图像处理 / 无外部 API</small></div></aside><main><header><div><span class="eyebrow">WEAVE / SURFACE / LIGHT</span><h1 id="title">把织物变成可交付的材质。</h1><p id="subtitle">组织与照片源图 · 相对高度 · 法线 · 粗糙度 · AO</p></div><div class="actions"><button id="archive">保存工程</button><button id="export" class="primary">下载贴图包 ↗</button></div></header><section id="empty"><h2>从一块合成织物开始</h2><p>示范为程序生成图案，不代表实测材质。</p><button id="start" class="primary">创建合成示范</button></section><div id="editor" hidden><div class="workspace"><section class="viewer"><div class="toolbar"><select id="channel"><option value="preview">平面光照</option><option value="albedo">底色 Albedo</option><option value="height">相对高度</option><option value="normal">切线法线</option><option value="roughness">粗糙度</option><option value="ao">环境遮蔽 AO</option><option value="orm">ORM 通道包</option></select><span class="seg" id="viewseg"><button type="button" data-v="flat" class="active">平面</button><button type="button" data-v="sphere">球面</button></span><span id="spherebar" hidden><label>球面重复 <input type="number" id="sphererep" min="1" max="24" step="1" value="4"></label><button type="button" id="spherereset">复位视角</button><small>拖动旋转 · 光源固定在画面中</small></span><label id="repeatlabel"><input type="checkbox" id="repeat">3×3 平铺</label><button id="inspect">边界 / 直方图</button></div><div class="stage"><img id="picture" alt="当前材质通道"><canvas id="sphere" hidden></canvas><span id="revision"></span></div><div class="thumbs" id="thumbs"></div><pre id="report" hidden></pre></section><section class="controls"><h2>材质构造</h2><label>名称<input id="name"></label><div class="row"><button id="upload">导入照片源图</button><select id="mode"><option value="weave">程序织纹</option><option value="source">照片源图</option></select></div><form id="settings"><div id="fields"></div><button class="primary wide">应用材质设置</button></form><div class="versions"><h3>材质版本</h3><div class="row"><input id="snaplabel" placeholder="版本名称"><button id="snapshot">留存</button></div><div id="snapshots"></div></div></section></div><p class="footnote">高度由相对灰度近似，光照为 CPU 平面近似；球面观察为浏览器端实时着色，旋转与重复次数仅影响观察，不改变下载的原始贴图。贴图上限 1024²，源图最多 1600 万像素；没有实测物理尺度。源图准备结果下载后可在此导入。</p></div><div id="toast" role="status"></div><input type="file" id="sourcefile" accept="image/png,image/jpeg" hidden><input type="file" id="projectfile" accept=".zip" hidden></main><script src="/static/sphere.js"></script><script src="/static/loom.js"></script></body></html>
